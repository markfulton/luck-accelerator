<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Montserrat:wght@800&display=swap" rel="stylesheet">
<style>
/* The README wordmark. The mark is the dashboard's own clover coin. Open with
   #dark for the cream version GitHub's dark theme gets; the default is ink for
   the light theme. Render at --window-size=900,200, scale 2. */
html,body{margin:0;padding:0;background:transparent}
:root{--ink:#18261d;--sub:#56645a}
.dark{--ink:#f1e8cb;--sub:#a9b8ad}
.l{width:900px;height:200px;display:flex;align-items:center;justify-content:center;gap:26px}
.coin{position:relative;width:118px;height:118px;border-radius:50%;background:radial-gradient(circle at 34% 28%,#f7e09a 0%,#d6a93c 46%,#94700f 100%);box-shadow:inset 0 0 0 4px rgba(255,255,255,.42),inset 0 -6px 0 rgba(0,0,0,.18),0 6px 16px -6px rgba(120,85,10,.6)}
.coin::before{content:"";position:absolute;inset:12px;border-radius:50%;border:2.5px solid rgba(122,90,15,.55)}
.coin svg{position:absolute;inset:27px}
.w{display:flex;flex-direction:column;gap:9px}
.name{font-family:Montserrat,system-ui,sans-serif;font-weight:800;font-size:70px;line-height:1;letter-spacing:-.03em;color:var(--ink);white-space:nowrap}
.tag{font-family:"JetBrains Mono",monospace;font-weight:500;font-size:16px;letter-spacing:.2em;color:var(--sub);padding-left:4px}
</style></head><body>
<div class="l" id="l">
<div class="coin"><svg viewBox="0 0 64 64"><g fill="#13583a"><circle cx="21" cy="21" r="12"/><circle cx="43" cy="21" r="12"/><circle cx="21" cy="43" r="12"/><circle cx="43" cy="43" r="12"/></g><path d="M32 34 C34 46 38 52 44 58" stroke="#13583a" stroke-width="4" fill="none" stroke-linecap="round"/></svg></div>
<div class="w"><div class="name">Luck Accelerator</div><div class="tag">FREE CLAUDE SKILL · BY REINVENTING.AI</div></div>
</div>
<script>if(location.hash==="#dark")document.getElementById("l").classList.add("dark")</script>
</body></html>
